spring.application.name=projet_3

# Demande a Spring de lire le fichier .env a la racine du projet (s'il existe)
# Le .env contient les vraies valeurs secretes et n'est jamais envoye sur GitHub
spring.config.import=optional:file:.env[.properties]

# ===== Connexion a la base de donnees MySQL =====

# Adresse de la base de donnees.
# Format attendu : jdbc:mysql://ADRESSE_DU_SERVEUR:PORT/NOM_DE_LA_BASE
#   - ADRESSE_DU_SERVEUR : "localhost" si MySQL tourne sur ton PC, sinon l'adresse du serveur
#   - PORT : 3306 est le port par defaut de MySQL
#   - NOM_DE_LA_BASE : le nom de ta base (elle doit deja exister dans MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/chatop_db

# Nom de l'utilisateur MySQL : la vraie valeur est dans le .env (DB_USERNAME)
spring.datasource.username=${DB_USERNAME}

# Mot de passe de cet utilisateur MySQL : la vraie valeur est dans le .env (DB_PASSWORD)
spring.datasource.password=${DB_PASSWORD}
