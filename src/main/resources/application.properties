spring.application.name=projet_3

# Port de l'application (basé sur le projet angular pointant vers  localhost:3001/api/ )
server.port=3001

# Messages d'erreur toujours en anglais, quelle que soit la langue du navigateur
spring.web.locale=en
spring.web.locale-resolver=fixed

# Charge les secrets depuis le fichier .env a la racine du projet (ignore par Git)
# Copier .env.example en .env puis le remplir
spring.config.import=optional:file:.env[.properties]

# ===== Base de donnees MySQL =====

# Hote et port lus dans le .env, sinon localhost et 3306 (port par defaut de MySQL). La base chatop_db doit deja exister.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/chatop_db

# Valeurs lues dans le .env
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Verifie au demarrage que les entites correspondent aux tables (ne modifie jamais la base)
spring.jpa.hibernate.ddl-auto=validate

# Garde les noms de tables tels qu'ecrits (USERS...) : par defaut Spring les met en minuscules,
# ce qui ne marche pas sous Linux ou MySQL fait la difference entre majuscules et minuscules
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Ferme la connexion a la base des que le service a fini, au lieu de la garder jusqu'a la fin de la requete HTTP
spring.jpa.open-in-view=false

# ===== JWT =====

# Valeur lue dans le .env (au moins 32 caracteres)
jwt.secret=${JWT_SECRET}

# ===== Upload des images =====

# Taille max d'un fichier envoye (1MB par defaut)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dossier sur le disque ou sont enregistrees les images
app.upload-dir=uploads

# Swagger actif volontairement (documentation demandee par le projet). A passer a false en production
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
