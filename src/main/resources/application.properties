spring.application.name=projet_3

# Port de l'application (basé sur le projet angular pointant vers  localhost:3001/api/ )
server.port=3001

# Charge les secrets depuis le fichier .env a la racine du projet (ignore par Git)
# Copier .env.example en .env puis le remplir
spring.config.import=optional:file:.env[.properties]

# ===== Base de donnees MySQL =====

# 3306 = port par defaut de MySQL. La base chatop_db doit deja exister.
spring.datasource.url=jdbc:mysql://localhost:3306/chatop_db

# Valeurs lues dans le .env
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Verifie au demarrage que les entites correspondent aux tables (ne modifie jamais la base)
spring.jpa.hibernate.ddl-auto=validate

# ===== JWT =====

# Valeur lue dans le .env (au moins 32 caracteres)
jwt.secret=${JWT_SECRET}

# ===== Upload des images =====

# Taille max d'un fichier envoye (1MB par defaut)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
